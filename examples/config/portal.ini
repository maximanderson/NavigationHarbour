# Portal Core example: two screens that use the example navigation files.
# Lines starting with # or ; are comments. Values are not quoted.
#
# Needed in this file: [portal], and for each screen a [screen.<id>] section with its
# [screen.<id>.nav.left] (the navigation tree) and [screen.<id>.content] (what opens when you pick an item).
# [usage_monitor] and [ai] are optional: when they are absent, both features are off and no backend is needed.

[portal]
title = Riverton Utilities
# Must be the id of one of the screens below (the part after "screen.").
defaultScreen = dashboards
theme = dark
tabsPosition = center

# Defaults for every iframe. An empty "allow" grants the framed page no extra browser permissions.
[renderer.iframe]
allow =
referrerPolicy = strict-origin-when-cross-origin


# ---- Screen 1: navigation tree on the left, the picked dashboard on the right ----
[screen.dashboards]
title = Dashboards
layout = left

[screen.dashboards.nav.left]
title = Riverton Navigation
type = tree
# Served by Portal Core from the "navigation" folder of the public directory.
source = /navigation/example-navigation.json
search = true
searchMinChars = 3
searchAttributes = title

[screen.dashboards.content]
renderer = iframe
# Shown before anything is picked. Leave empty to show a short "select an item" message instead.
defaultUrl =


# ---- Screen 2: the same tree, but the content area starts with the Branch Screen ----
[screen.sites]
title = Sites
layout = left

[screen.sites.nav.left]
title = Riverton Navigation
type = tree
source = /navigation/example-navigation.json
search = true
searchMinChars = 3
searchAttributes = title

[screen.sites.content]
renderer = iframe
defaultUrl =
defaultRenderer = branches
branchesSource = /navigation/example-branches.json


# ---- Optional: record which items people open (needs the Portal Core backend) ----
# Remove host and port to call /api/usage on the same server that served the portal (standalone installs).
# For development, with Vite on 5173 and the backend on 5247, use:
# [usage_monitor]
# enabled = true
# protocol = http
# host = localhost
# port = 5247
# endpoint = /api/usage
