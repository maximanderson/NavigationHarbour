[logging]
# Browser console diagnostics of Portal Core itself (not sent to the backend).
enabled = false
level = info
console = true

[portal]
title = Portal Core Demo
defaultScreen = operations
theme = dark
tabsPosition = center

[renderer.iframe]
allow =
referrerPolicy = strict-origin-when-cross-origin


# Screen 1: a navigation tree. Leaf items are clickable and are logged by the Usage Monitor.
# The demo data is entirely fictional (Aquaville).
[screen.operations]
title = Operations
layout = left

[screen.operations.nav.left]
title = Aquaville Network
type = tree
source = /navigation/demo-navigation.json
search = true
searchMinChars = 3
searchAttributes = title

[screen.operations.content]
renderer = iframe
defaultUrl =


# Screen 2: the Branch Screen. Selecting a branch re-roots the navigation tree; "Restore menu" shows the whole tree.
[screen.regions]
title = Regions
layout = left

[screen.regions.nav.left]
title = Aquaville Regions
type = tree
source = /navigation/demo-navigation.json
search = true
searchMinChars = 3
searchAttributes = title

[screen.regions.content]
renderer = iframe
defaultUrl =
defaultRenderer = branches
branchesSource = /navigation/demo-branches.json


# Screen 3: static HTML content served from the public content folder.
[screen.reports]
title = Reports
layout = none

[screen.reports.content]
renderer = html
source = /content/reports.html


# API calls of the portal. protocol/host/port are used when host is set (development: Vite on 5173 calls the
# backend on 5247). In a standalone installation, where Portal Core serves both the portal and the API,
# remove host and port (leave host empty): the portal then calls /api/... on the server it was loaded from.
# deploy/portal.standalone.ini is this file without host and port (a test keeps the two in step).
# The AI assistant has no screen in this demo and is not called.
[usage_monitor]
enabled = true
protocol = http
host = localhost
port = 5247
endpoint = /api/usage

[ai]
enabled = false
provider = local
protocol = http
host = localhost
port = 5247
endpoint = /api/ai/query
model = placeholder
