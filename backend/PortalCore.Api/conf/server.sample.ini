; Portal Core private server configuration (sample)
;
; Copy this file to server.ini (same folder) and edit it.
; Never place server.ini in a web-accessible directory (for example public\ or wwwroot).
;
; Rules
;   - Comments must be on their own line, starting with ; or #.
;     Text after a value is part of the value:  port = 5247 ; main   is INVALID.
;   - Relative paths are relative to the Portal Core home directory, not the working directory.
;   - Unknown sections and settings are rejected, so typos are reported at startup.
;   - Changes require a restart of Portal Core.
;
; Check this file without starting the server:
;   PortalCore --check-config
;   PortalCore --print-config          (shows effective values and their source; secrets hidden)
;
; WHAT IS APPLIED (Stage 2)
;   Applied now:     [log] (all keys), [paths] data, logs, ai, backups,
;                    [server] protocol, http_addr, port and [tls] (Kestrel, see below)
;   Validated only:  [server] domain, root_url, [paths] public (public hosting comes in a later stage)
;
; KESTREL: when protocol, http_addr or port is set, Portal Core listens on exactly that one address and
; port and ignores ASPNETCORE_URLS / --urls (a warning is logged). When none of them is set, nothing changes:
; dotnet run still uses launchSettings.json. protocol = https needs a [tls] certificate; there is no fallback to http.
; A setting that is left out keeps the shipped appsettings.json default.
; See docs/server-configuration.md.

[server]
; http or https
protocol = http
; Address to listen on: an IP address, localhost, or empty for all interfaces.
http_addr = 127.0.0.1
; Public host name of this server.
domain = localhost
; TCP port.
port = 5247
; Optional. Only needed when users reach Portal Core through a different URL than Kestrel
; sees (reverse proxy, port mapping). Defaults to protocol://domain:port/. No path allowed.
; root_url = http://localhost:5247/

[tls]
; Only used when protocol = https. Relative paths are relative to the Portal Core home directory.
; Keep certificate files OUT of [paths] public. Restrict this file and the certificate files with file-system
; permissions: they contain a password / private key. The password may instead come from the environment:
;   PORTALCORE_tls__cert_password=...   (never printed or logged)
; PFX (PKCS#12):
; cert_file = conf/portalcore.pfx
; cert_password = change-me
; PEM certificate with a separate private key (cert_password only if the key is encrypted):
; cert_file = conf/portalcore.pem
; cert_key_file = conf/portalcore.key

[paths]
; Relative to the Portal Core home directory, or absolute.
; data: directory of the SQLite database (file name is always portalcore.db). The database is
; never created automatically outside Development: run "PortalCore --init-db" once on a new
; installation. In development, leave this out to keep using <project>/portalcore.db.
data = data
logs = logs
public = public
; AI files: knowledge in <ai>/knowledge, prompt templates in <ai>/prompts.
; Leave this out in development to keep the existing Data/knowledge and Data/prompts folders.
ai = ai

[log]
; debug, info, warning or error
level = info
console = true
file = true
max_file_size_mb = 10
retain_days = 14
